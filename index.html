<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendar Quest · Planificación & Productividad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --google-blue: #1a73e8;
      --google-blue-hover: #1557b0;
      --google-blue-bg: #e8f0fe;
      --google-red: #d93025;
      --google-yellow: #f9ab00;
      --google-green: #1e8e3e;
      --google-purple: #9334e6;
      --google-orange: #e8710a;
      --surface: #ffffff;
      --background: #f8fafd;
      --border-color: #dadce0;
      --text-primary: #3c4043;
      --text-secondary: #5f6368;
      --text-dark: #202124;
      --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-pill: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--background);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR ESTILO GOOGLE CALENDAR */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      height: 64px;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-dark);
      font-family: 'Google Sans', sans-serif;
      font-size: 19px;
      font-weight: 500;
    }

    .calendar-icon-badge {
      width: 34px;
      height: 34px;
      background: var(--google-blue);
      color: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 2px 4px rgba(26,115,232,0.3);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }

    .btn-today {
      border: 1px solid var(--border-color);
      background: transparent;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-family: 'Google Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-today:hover {
      background: #f1f3f4;
    }

    .nav-arrow {
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .nav-arrow:hover {
      background: #f1f3f4;
    }

    .current-date-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 18px;
      color: var(--text-dark);
      font-weight: 500;
      min-width: 170px;
    }

    /* GAMIFICATION HUD PROFESIONAL */
    .hud-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .hud-metric {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .hud-metric i {
      font-size: 14px;
    }

    .streak-badge {
      color: var(--google-orange);
    }

    .xp-badge {
      color: var(--google-blue);
    }

    .rank-badge {
      color: var(--text-dark);
      font-family: 'Google Sans', sans-serif;
      background: var(--google-blue-bg);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-stats {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-stats:hover {
      background: #f1f3f4;
      color: var(--text-dark);
    }

    /* CONTENEDOR PRINCIPAL */
    .app-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL (DESKTOP) / BOTÓN CREAR */
    .sidebar {
      width: 256px;
      background: var(--surface);
      border-right: 1px solid var(--border-color);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .btn-create {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px 10px 16px;
      border-radius: var(--radius-pill);
      border: none;
      background: #ffffff;
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
      cursor: pointer;
      font-family: 'Google Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      width: fit-content;
      transition: box-shadow 0.2s, background-color 0.2s;
    }

    .btn-create:hover {
      box-shadow: 0 2px 6px 0 rgba(60,64,67,0.3), 0 6px 12px 4px rgba(60,64,67,0.15);
      background-color: #f8fafd;
    }

    .btn-create-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* BARRA DE PROGRESO DE NIVEL EJECUTIVO */
    .progress-box {
      background: var(--background);
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid #edf0f5;
    }

    .progress-box-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      background: #e0e0e0;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--google-blue);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* FILTROS DE CATEGORÍAS */
    .filter-section h4 {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .filter-item:hover {
      background: #f1f3f4;
    }

    .filter-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* VISTA DE CALENDARIO */
    .calendar-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border-color);
      background: var(--surface);
      text-align: center;
      padding: 10px 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: 'Google Sans', sans-serif;
      text-transform: uppercase;
    }

    .month-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 1fr);
      overflow-y: auto;
      background: var(--border-color);
      gap: 1px;
    }

    .day-cell {
      background: var(--surface);
      padding: 6px;
      display: flex;
      flex-direction: column;
      min-height: 90px;
      position: relative;
      cursor: pointer;
      transition: background 0.12s;
    }

    .day-cell:hover {
      background: #f8fafd;
    }

    .day-cell.other-month {
      background: #fafafa;
      color: #9aa0a6;
    }

    .day-cell.selected {
      background: #f0f7ff;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .day-number {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      border-radius: 50%;
    }

    .day-cell.today .day-number {
      background: var(--google-blue);
      color: #ffffff;
      font-weight: 700;
    }

    .day-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      flex: 1;
    }

    /* PÍLDORA DE EVENTO / TAREA EN CALENDARIO */
    .event-pill {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .event-pill.is-task {
      border-left: 3px solid rgba(0,0,0,0.3);
    }

    .event-pill.completed {
      opacity: 0.55;
      text-decoration: line-through;
    }

    /* PANEL LATERAL DERECHO: AGENDA DEL DÍA */
    .agenda-drawer {
      width: 320px;
      background: var(--surface);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .agenda-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agenda-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 16px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .agenda-list {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agenda-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .agenda-item:hover {
      box-shadow: var(--shadow-sm);
    }

    .agenda-item.completed {
      background: #f8f9fa;
      border-color: #e8eaed;
      opacity: 0.65;
    }

    .agenda-item-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .agenda-item.completed .custom-checkbox {
      background: var(--google-green);
      border-color: var(--google-green);
      color: white;
      font-size: 10px;
    }

    .agenda-item-info {
      flex: 1;
    }

    .agenda-item-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .agenda-item.completed .agenda-item-name {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .agenda-item-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .agenda-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 12px;
      color: white;
    }

    .xp-reward-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--google-blue);
      background: var(--google-blue-bg);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* MODAL DE CREACIÓN */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(32,33,36,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.18s ease-out;
    }

    @keyframes modalPop {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 16px 20px;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Google Sans', sans-serif;
      font-size: 16px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 75vh;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--google-blue);
      box-shadow: 0 0 0 1px var(--google-blue);
    }

    .type-switcher {
      display: flex;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      background: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .type-btn.active {
      background: var(--google-blue-bg);
      color: var(--google-blue);
      font-weight: 700;
    }

    .color-picker {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .color-choice {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
    }

    .color-choice.selected {
      border-color: #202124;
      transform: scale(1.1);
    }

    .modal-footer {
      padding: 12px 20px;
      background: #f8f9fa;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-primary);
    }

    .btn-primary {
      padding: 8px 20px;
      background: var(--google-blue);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: white;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--google-blue-hover);
    }

    /* MODAL DE ESTADÍSTICAS Y MÉTRICAS PROFESIONALES */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #f8fafd;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid #e1e7f0;
      text-align: center;
    }

    .stat-card .val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      font-family: 'Google Sans', sans-serif;
    }

    .stat-card .lbl {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* TOAST DE FEEDBACK DE XP */
    .xp-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #202124;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2000;
    }

    .xp-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ADAPTACIÓN MÓVIL Y PWA */
    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      .agenda-drawer {
        display: none;
      }
      .hud-container .rank-badge {
        display: none;
      }
      .current-date-title {
        font-size: 16px;
        min-width: auto;
      }
      .nav-controls {
        margin-left: 0;
      }
      .fab-mobile {
        display: flex !important;
      }
    }

    .fab-mobile {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--google-blue);
      border: none;
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- HEADER PROFESIONAL -->
  <header>
    <div class="header-left">
      <a href="#" class="brand">
        <div class="calendar-icon-badge" id="header-day-badge">31</div>
        <span>Calendar</span>
      </a>

      <div class="nav-controls">
        <button class="btn-today" onclick="goToToday()">Hoy</button>
        <button class="nav-arrow" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-arrow" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <h2 class="current-date-title" id="current-month-label">Mes Año</h2>
    </div>

    <!-- HUD DE GAMIFICACIÓN EJECUTIVA -->
    <div class="hud-container">
      <div class="hud-metric streak-badge" title="Racha consecutiva de objetivos cumplidos">
        <i class="fa-solid fa-fire"></i>
        <span id="streak-count">0</span>d
      </div>

      <div class="hud-metric xp-badge" title="Puntos de Enfoque acumulados">
        <i class="fa-solid fa-bolt"></i>
        <span id="xp-count">0</span> XP
      </div>

      <div class="rank-badge" id="rank-name">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Nivel 1</span>
      </div>

      <button class="btn-stats" onclick="openStatsModal()" title="Métricas y Rendimiento">
        <i class="fa-solid fa-chart-simple"></i>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="app-main">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <button class="btn-create" onclick="openNewModal()">
        <span class="btn-create-icon">
          <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#EA4335" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        </span>
        <span>Crear</span>
      </button>

      <!-- PROGRESO DEL NIVEL -->
      <div class="progress-box">
        <div class="progress-box-header
